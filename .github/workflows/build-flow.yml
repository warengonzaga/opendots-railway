name: Build Flow

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-flow:
    permissions:
      contents: write
      packages: write
      pull-requests: write
      security-events: write
      actions: read
    uses: wgtechlabs/build-flow-action/.github/workflows/app.yml@260b9a063ef59ccc760155c19902320feb7e25cb # v0.3.1
    with:
      enable-container: true
      enable-release: true
      publish-dev-artifacts: false
      publish-pr-artifacts: false
      publish-manual-artifacts: false
      codeql-build-mode: none
      ci-profile: node
      ci-runtime-version: '24'
      ci-test-command: npm test
      ci-build-command: |
        npm run build:app
        npm run build:browser
      ci-docker-smoke-command: npm run test:smoke
      container-registry: ghcr
      container-platforms: linux/amd64
      container-release-platforms: linux/amd64
      container-images: |
        [
          {"image-name": "opendots-railway-app", "build-args": "OPENDOTS_SERVICE=app"},
          {"image-name": "opendots-railway-browser", "build-args": "OPENDOTS_SERVICE=browser"}
        ]
